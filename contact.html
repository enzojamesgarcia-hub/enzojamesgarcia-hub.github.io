<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-title">Your Name</a>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <h1>Contact Me</h1>
        <p>
          Replace this with your real email address or social links, and
          feel free to keep or remove the form below.
        </p>

        <ul>
          <li>Email: <a href="mailto:you@example.com">you@example.com</a></li>
          <li>GitHub: <a href="https://github.com/yourusername">github.com/yourusername</a></li>
        </ul>

        <!--
          This form doesn't send anywhere yet — a real contact form needs
          a backend or a service like Formspree/Google Forms to receive
          messages. For now it's just a structure to practice with.
        -->
        <form>
          <label for="name">Name</label>
          <input type="text" id="name" name="name">

          <label for="email">Email</label>
          <input type="email" id="email" name="email">

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>

          <button type="submit" class="button">Send</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">

    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
