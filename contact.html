<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Contact Enzo Garcia">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="site-title">Enzo Garcia</a>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>

        <li><a href="final-project.html">Final Project</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section page-header">
      <div class="container narrow-layout">
        <p class="eyebrow">Get in touch</p>
        <h1>Contact Me</h1>
        <ul id="contact-list" class="info-list"></ul>
      </div>
    </section>

    <section class="section alt-section">
      <div class="container narrow-layout">
        <form class="contact-form">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name">

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here"></textarea>

          <button type="submit" class="button">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Enzo Garcia. Built with HTML, CSS, and JavaScript.</p>
    </div>

  <script src="site-data.js"></script>
